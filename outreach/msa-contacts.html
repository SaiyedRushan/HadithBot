<style>
  :root {

      --top: #232419;
      --ink: #ece7d3;
      --soft: #a9a388;
      --line: #33342a;
      --link: #ddbb74;
      --tick: #ddbb74;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font: 1rem/1.5 "Avenir Next", Avenir, "Segoe UI", system-ui, sans-serif;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 1;
    background: var(--top);
    color: var(--top-text);
    padding: 1rem max(1rem, env(safe-area-inset-right)) 0 max(1rem, env(safe-area-inset-left));
  }
  .top {
    max-width: 48rem;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 0.25rem 1.5rem;
    padding-bottom: 0.9rem;
  }
  h1 {
    margin: 0;
    font-size: 1.6rem;
    line-height: 1.2;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    text-wrap: balance;
  }
  .help { margin: 0.15rem 0 0; color: var(--top-soft); font-size: 0.9rem; }
  button {
    font: inherit;
    font-size: 0.9rem;
    min-height: 2.75rem;
    padding: 0 0.9rem;
    border-radius: 0.5rem;
    border: 1px solid var(--top-soft);
    background: transparent;
    color: inherit;
    cursor: pointer;
    font-variant-numeric: tabular-nums;
  }
  button:hover { background: rgb(255 255 255 / 0.1); }
  .bar { height: 5px; background: var(--track); margin: 0 calc(-1 * max(1rem, env(safe-area-inset-left))); }
  .bar div { height: 100%; background: var(--amber); transition: width 200ms ease-out; }
  ul { list-style: none; margin: 0 auto; padding: 0 1rem 6rem; max-width: 50rem; }
  li {
    display: grid;
    grid-template-columns: 7.25rem minmax(0, 1fr);
    gap: 0.5rem;
    padding: 1rem 0;
    border-bottom: 1px solid var(--line);
  }
  li[hidden] { display: none; }
  .tick {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    align-self: start;
    min-height: 2.75rem;
    margin-top: -0.55rem;
    cursor: pointer;
    font-size: 0.9rem;
    color: var(--soft);
  }
  .tick input { width: 1.3rem; height: 1.3rem; margin: 0; accent-color: var(--tick); cursor: pointer; scroll-margin-top: 9rem; }
  h2 { margin: 0; font-size: 1.1rem; line-height: 1.3; font-weight: 600; }
  p { margin: 0; }
  .where { color: var(--soft); font-size: 0.9rem; }
  .links { display: flex; flex-wrap: wrap; gap: 0 1rem; margin-top: 0.15rem; }
  .links a { display: inline-block; padding: 0.3rem 0; overflow-wrap: anywhere; }
  a { color: var(--link); }
  .notes { font-size: 0.9rem; margin-top: 0.2rem; max-width: 65ch; text-wrap: pretty; overflow-wrap: anywhere; }
  li.done h2 { text-decoration: line-through; color: var(--soft); }
  .empty { max-width: 48rem; margin: 2rem auto; padding: 0 1rem; }
  #toast {
    position: fixed;
    left: 50%;
    bottom: calc(1rem + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    width: max-content;
    max-width: calc(100vw - 2rem);
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 0.4rem 0.5rem 0.4rem 1rem;
    border-radius: 0.6rem;
    background: var(--top);
    color: var(--top-text);
    box-shadow: 0 6px 20px rgb(35 36 25 / 0.35);
  }
  #toast[hidden] { display: none; }
  :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  main :focus-visible { outline-color: var(--link); }
  @media (max-width: 34rem) {
    li { grid-template-columns: minmax(0, 1fr); gap: 0.35rem; }
    .tick { margin-top: 0; order: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .bar div { transition: none; }
  }
</style>
</head>
<body>
<header>

</header>
<main>

</main>

const ALREADY_CONTACTED = ["University of Waterloo", "McGill University", "University of Alberta", "Carleton University", "University of Toronto Mississauga", "University of Guelph", "Seneca Polytechnic", "Rensselaer Polytechnic Institute"];
const KEY = "msa-contacted";

function loadContacted() {
  try {
    const saved = localStorage.getItem(KEY);
    if (saved) return new Set(JSON.parse(saved));
  } catch (e) {}
  return new Set(ALREADY_CONTACTED);
}

const contacted = loadContacted();
let showContacted = false;
let toastTimer;
let lastTicked = null;

const list = document.getElementById("list");
const toast = document.getElementById("toast");
const toastText = document.getElementById("toast-text");

function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify([...contacted]));
    return true;
  } catch (e) {
    return false;
  }
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text) node.textContent = text;
  return node;
}

function link(href, text) {
  const a = el("a", "", text);
  a.href = href;
  if (!href.startsWith("mailto:")) {
    a.target = "_blank";
    a.rel = "noopener";
  }
  return a;
}

// Notes are plain text, with the odd URL worth being able to click.
function notesWithLinks(text) {
  const p = el("p", "notes");
  for (const part of text.split(/(https?:\/\/[^\s,;)]+)/)) {
    if (/^https?:\/\//.test(part)) {
      const url = part.replace(/\.$/, "");
      p.append(link(url, url), part.slice(url.length));
    } else {
      p.append(part);
    }
  }
  return p;
}

function buildRow(c) {
  const li = el("li");
  li.dataset.key = c.institution;

  const label = el("label", "tick");
  const box = el("input");
  box.type = "checkbox";
  box.setAttribute("aria-label", "Contacted " + c.institution);
  box.addEventListener("change", () => setContacted(c, li, box.checked));
  label.append(box, "Contacted");

  const body = el("div");
  body.append(el("h2", "", c.institution));
  const place = [c.org, c.region === "National" ? null : c.region, c.country].filter(Boolean).join(", ");
  body.append(el("p", "where", place + ". Confidence: " + c.confidence));

  const links = el("p", "links");
  if (c.email) links.append(link("mailto:" + c.email, c.email));
  if (c.instagram) links.append(link(c.instagram, "Instagram"));
  if (c.discord) links.append(link(c.discord, "Discord"));
  if (c.website) links.append(link(c.website, "Website"));
  body.append(links);
  if (c.notes) body.append(notesWithLinks(c.notes));

  li.append(label, body);
  return li;
}

function setContacted(c, li, isContacted) {
  if (isContacted) contacted.add(c.institution);
  else contacted.delete(c.institution);
  const saved = save();

  // The row is about to vanish, so keep keyboard focus in the same place.
  let next = li.nextElementSibling;
  while (next && (next.hidden || contacted.has(next.dataset.key))) next = next.nextElementSibling;
  refresh();
  if (isContacted && li.hidden && next) next.querySelector("input").focus({ preventScroll: true });

  if (!saved) {
    showToast("Your browser didn't save that tick, so it will be gone when you close this page.", null);
  } else if (isContacted) {
    showToast("Marked " + c.org + " as contacted.", c);
  } else {
    hideToast();
  }
}

function showToast(text, c) {
  lastTicked = c;
  toastText.textContent = text;
  document.getElementById("undo").hidden = !c;
  toast.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, c ? 6000 : 10000);
}

function hideToast() {
  clearTimeout(toastTimer);
  toast.hidden = true;
  lastTicked = null;
}

function refresh() {
  const total = CONTACTS.length;
  const done = CONTACTS.filter((c) => contacted.has(c.institution)).length;
  const left = total - done;
  if (done === 0) showContacted = false;

  for (const li of list.children) {
    const isDone = contacted.has(li.dataset.key);
    li.classList.toggle("done", isDone);
    li.querySelector("input").checked = isDone;
    li.hidden = isDone && !showContacted;
  }

  const heading = left === 0
    ? "You've contacted all " + total + " MSAs"
    : left + (left === 1 ? " MSA" : " MSAs") + " left to contact";
  document.getElementById("heading").textContent = heading;
  document.title = left + " left: MSA contacts";
  document.getElementById("progress").style.width = (done / total) * 100 + "%";

  const show = document.getElementById("show");
  show.hidden = done === 0;
  show.textContent = (showContacted ? "Hide" : "Show") + " the " + done + " you've contacted";
  document.getElementById("empty").hidden = !(left === 0 && !showContacted);
}

document.getElementById("show").addEventListener("click", () => {
  showContacted = !showContacted;
  refresh();
});

document.getElementById("undo").addEventListener("click", () => {
  if (!lastTicked) return;
  const name = lastTicked.institution;
  contacted.delete(name);
  const saved = save();
  hideToast();
  refresh();
  const row = [...list.children].find((li) => li.dataset.key === name);
  row.querySelector("input").focus();
  if (!saved) showToast("Your browser didn't save that change, so it will be gone when you close this page.", null);
});

list.append(...CONTACTS.map(buildRow));
refresh();
</script>
</body>
</html>
