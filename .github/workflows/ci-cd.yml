name: CI/CD

on:
  push:
    branches: [main]
    # Website/docs-only changes don't affect the running bot, so skip the whole
    # pipeline (and the redeploy) when a push touches only these paths.
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
  workflow_dispatch: # lets you trigger a deploy manually from the Actions tab

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.2"
      - name: Install dependencies (runtime + dev, from lockfile)
        run: uv sync --frozen
      - name: Lint (ruff catches undefined names, bad imports & style)
        run: uv run ruff check .
      - name: Run pytest
        run: uv run pytest -q

  deploy:
    name: Deploy to Oracle VM
    needs: test # only deploy if tests pass
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production # secrets live in this environment

    steps:
      - name: Redeploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/HadithBot
            git pull --ff-only
            docker compose up -d --build
            docker image prune -f
